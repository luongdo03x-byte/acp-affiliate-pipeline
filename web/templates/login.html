{% extends "base.html" %}
{% block title %}Đăng nhập — ACP{% endblock %}
{% block login_content %}
<div class="login-shell">
  <div class="login-brand">
    <div class="brand-mark">ACP</div>
    <h1>Affiliate Content Pipeline</h1>
    <p>Đăng nhập vào bảng điều khiển vận hành.</p>
  </div>
  {% if err %}<div class="alert alert--error"><strong>Không đăng nhập được.</strong><span>{{ err }}</span></div>{% endif %}
  <form method="post" class="card login-card">
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input id="password" type="password" name="password" autofocus autocomplete="current-password" required>
    </div>
    <button class="btn btn--primary btn--wide login-submit" type="submit">Đăng nhập</button>
  </form>
</div>
{% endblock %}
