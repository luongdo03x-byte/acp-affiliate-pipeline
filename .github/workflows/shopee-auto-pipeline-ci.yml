name: Shopee Auto Pipeline CI

on:
  push:
    branches: ["feat/shopee-auto-pipeline", "feat/shopee-product-pool-v2"]
  pull_request:
    paths:
      - "core/__init__.py"
      - "core/shopee_auto_runtime.py"
      - "core/shopee_auto_scheduler.py"
      - "core/shopee_csv_import.py"
      - "core/shopee_enrichment_jobs.py"
      - "core/shopee_product_pool.py"
      - "core/auto_scheduler.py"
      - "core/pipeline.py"
      - "run.py"
      - "shopee_auto_enrich.py"
      - "web/shopee_csv_import.py"
      - "web/shopee_image_enrichment.py"
      - "web/templates/shopee_image_enrichment.html"
      - "ops/acp-auto-schedule.service"
      - "tests/test_shopee_auto_pipeline.py"
      - "tests/test_shopee_csv_web.py"
      - "tests/test_shopee_image_enrichment_web.py"
      - "tests/test_shopee_product_pool_v2.py"
      - ".github/workflows/shopee-auto-pipeline-ci.yml"

jobs:
  shopee-auto:
    runs-on: ubuntu-latest
    env:
      ACP_ADAPTER: mock
      ACP_SOURCE: mock
      ACP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Capture focused test output
        run: |
          set +e
          python -m unittest \
            tests.test_shopee_product_pool_v2 \
            tests.test_shopee_auto_pipeline \
            tests.test_shopee_csv_web \
            tests.test_shopee_csv_enrichment \
            tests.test_shopee_image_enrichment_flow \
            tests.test_shopee_image_enrichment_web \
            tests.test_auto_scheduler \
            tests.test_auto_scheduler_safety -v > shopee-auto-test-output.txt 2>&1
          echo "$?" > shopee-auto-test-exit.txt
          exit 0
      - name: Upload focused test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopee-auto-test-output
          path: |
            shopee-auto-test-output.txt
            shopee-auto-test-exit.txt
      - name: Enforce focused test result
        run: test "$(cat shopee-auto-test-exit.txt)" = "0"
      - name: Compile Python surfaces
        run: python -m compileall core web tests adapters run.py shopee_auto_enrich.py
      - name: Whitespace check
        run: git diff --check HEAD^
