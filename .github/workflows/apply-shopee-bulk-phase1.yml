name: Apply Shopee Bulk Affiliate Phase 1

on:
  push:
    branches:
      - feat/shopee-bulk-affiliate

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/shopee-bulk-affiliate
          fetch-depth: 0
          path: acp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r acp/requirements.txt

      - name: RED — add focused tests and prove feature is missing
        shell: bash
        run: |
          python acp/tools/apply_shopee_bulk_phase1.py tests
          set +e
          python acp/tests/test_shopee_bulk_affiliate.py > /tmp/shopee-red.log 2>&1
          code=$?
          set -e
          cat /tmp/shopee-red.log
          if [ "$code" -eq 0 ]; then
            echo 'Expected focused test to fail before implementation, but it passed.'
            exit 1
          fi
          grep -q 'acp.core.shopee_bulk_affiliate' /tmp/shopee-red.log || {
            echo 'RED failed for an unexpected reason.'
            exit 1
          }

      - name: GREEN — apply Phase 1 implementation
        run: |
          python acp/tools/apply_shopee_bulk_phase1.py implementation
          python acp/tests/test_shopee_bulk_affiliate.py

      - name: Regression — existing ACP suites
        run: |
          python -m acp.tests.test_pipeline
          python -m acp.tests.test_pilot
          cd acp
          python tests/test_manage.py
          python -m py_compile core/shopee_bulk_affiliate.py web/shopee_bulk.py web/server.py
          git diff --check

      - name: Commit verified feature and remove temporary bootstrap files
        shell: bash
        run: |
          cd acp
          rm -f .github/workflows/apply-shopee-bulk-phase1.yml
          rm -f tools/apply_shopee_bulk_phase1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'feat: add Shopee bulk affiliate link generator [skip ci]'
          git push origin HEAD:feat/shopee-bulk-affiliate
